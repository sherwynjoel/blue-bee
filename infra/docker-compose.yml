# Local dev infra for Blue Bee — start with `npm run infra:up`.
# Postgres (PostGIS + TimescaleDB) and Redis. Local only — not production config.
services:
  postgres:
    # Custom PG16 + PostGIS + TimescaleDB image (vanilla postgres entrypoint).
    # NOT timescale/timescaledb-ha — Prisma fails P1010 against the -ha image (see README).
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: bluebee-postgres:local
    container_name: bluebee-postgres
    # TimescaleDB must be preloaded.
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    environment:
      POSTGRES_USER: bluebee
      POSTGRES_PASSWORD: bluebee
      POSTGRES_DB: bluebee
    ports:
      - "5432:5432"
    volumes:
      - bluebee_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluebee"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bluebee-redis
    ports:
      - "6379:6379"
    volumes:
      - bluebee_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO — a REAL S3-compatible object server (Increment 10). The API speaks the exact same AWS SDK
  # against it as it would against AWS S3 (via S3_ENDPOINT + path-style), so the presigned upload /
  # confirm / signed-read flow is fully protocol-proven locally without an AWS account. The API
  # creates the bucket on startup (ensureBucket) when S3_ENDPOINT is set — no init container needed.
  minio:
    image: minio/minio:latest
    container_name: bluebee-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - bluebee_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bluebee_pg:
  bluebee_redis:
  bluebee_minio:
